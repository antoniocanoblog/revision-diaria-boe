name: Descargar BOE oficial
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/descargar-boe.yml'
      - 'scripts/descargar_boe.py'
  schedule:
    # UTC: cubre las 07:37-08:57 peninsulares tanto en invierno como en verano.
    - cron: '37,47,57 5,6,7 * * *'
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a recuperar (AAAA-MM-DD); vacío = hoy'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: descargar-boe
  cancel-in-progress: false
jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar ventana horaria y descarga previa
        id: control
        env:
          EVENTO: ${{ github.event_name }}
          FECHA: ${{ inputs.fecha }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("Europe/Madrid"))
          date = os.environ.get("FECHA") or now.date().isoformat()
          scheduled = os.environ["EVENTO"] == "schedule"
          inside = 7*60+30 <= now.hour*60+now.minute < 9*60
          complete = False
          p = pathlib.Path("fuentes-boe") / date / "estado.json"
          try:
              meta = json.loads(p.read_text(encoding="utf-8"))
              complete = (meta.get("fecha") == date and
                          meta.get("estado") == "textos_comprobados" and
                          isinstance(meta.get("total"), int) and meta["total"] > 0 and
                          meta.get("textos_verificados") == meta["total"] and
                          bool(meta.get("indices")) and
                          all(pathlib.Path(f).is_file() for f in meta["indices"]))
          except (OSError, ValueError, TypeError):
              pass
          proceed = not scheduled or (inside and not complete)
          print(f"Hora local: {now.isoformat()}; edición: {date}; completa: {complete}; descargar: {proceed}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("proceder=" + str(proceed).lower() + "\n")
          PY
      - name: Consultar el BOE oficial
        if: steps.control.outputs.proceder == 'true'
        env:
          FECHA: ${{ inputs.fecha }}
        run: |
          set -euo pipefail
          if [ -n "$FECHA" ]; then
            python3 scripts/descargar_boe.py --fecha "$FECHA"
          else
            python3 scripts/descargar_boe.py
          fi
      - name: Guardar fuentes y estado de la descarga
        if: steps.control.outputs.proceder == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuentes-boe/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fuentes oficiales del BOE"
          for intento in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
