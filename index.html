<h1>Revisión diaria del BOE</h1>
<small>Melilla</small><h2>Histórico de informes</h2><nav id="history" aria-label="Histórico"></nav><a class="source" href="https://www.boe.es/" target="_blank" rel="noopener noreferrer">BOE oficial ↗</a></aside><main><article id="report" aria-live="polite"></article></main><script src="informes.js"></script><script>
const historyNav=document.querySelector('#history'),report=document.querySelector('#report');
const reports=[...(window.INFORMES||[])].filter(x=>x&&typeof x.fecha==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.fecha)&&typeof x.texto==='string').sort((a,b)=>b.fecha.localeCompare(a.fecha));
const el=(tag,t)=>{const e=document.createElement(tag);e.textContent=t;return e};
const date=s=>new Intl.DateTimeFormat('es-ES',{dateStyle:'long',timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'));
function link(text,url){try{const u=new URL(url);if(u.protocol==='https:'&&(u.hostname==='boe.es'||u.hostname==='www.boe.es')){let a=el('a',text);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a}}catch{}return document.createTextNode(text+' ('+url+')')}
function paragraph(s){const p=document.createElement('p');const re=/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)|(https:\/\/[^\s<>]+)|\*\*([^*]+)\*\*/g;let last=0;for(const m of s.matchAll(re)){p.append(document.createTextNode(s.slice(last,m.index)));if(m[2])p.append(link(m[1],m[2]));else if(m[3])p.append(link(m[3],m[3]));else p.append(el('strong',m[4]));last=m.index+m[0].length}p.append(document.createTextNode(s.slice(last)));return p}
function footer(){return el('footer','Seguimiento informativo de fuentes públicas. No constituye una publicación oficial de la Administración.')}
function summary(s){const box=el('section','');box.className='summary';box.append(el('h3','Resumen ejecutivo'));const counts=el('div','');counts.className='counts';for(const [name,key] of [['Melilla','melilla'],['Política Territorial','politicaTerritorial'],['Otros servicios','otros'],['Total de referencias únicas','total']]){const c=el('div','');c.className='count';c.append(el('strong',s[key]??'—'),el('small',name));counts.append(c)}box.append(counts);if(s.destacados)box.append(paragraph('**Destacan:** '+s.destacados));if(s.alerta)box.append(paragraph('**Alertas:** '+s.alerta));if(s.nota){const n=el('p',s.nota);n.className='note';box.append(n)}return box}function show(r){report.replaceChildren(el('h2',r.titulo||('Informe diario del BOE — '+date(r.fecha)+' | Melilla')));if(r.resumen)report.append(summary(r.resumen));for(const line of r.texto.split('\n')){if(!line.trim())continue;if(line.startsWith('### '))report.append(el('h4',line.slice(4)));else if(line.startsWith('## '))report.append(el('h3',line.slice(3)));else if(line.startsWith('# '))report.append(el('h3',line.slice(2)));else report.append(paragraph(line))}report.append(footer());for(const b of historyNav.querySelectorAll('button'))b.setAttribute('aria-current',String(b.dataset.fecha===r.fecha));document.title=date(r.fecha)+' | Revisión diaria del BOE';window.scrollTo(0,0)}
for(const r of reports){let b=el('button',date(r.fecha));b.dataset.fecha=r.fecha;b.onclick=()=>{location.hash=r.fecha;show(r)};historyNav.append(b)}
if(reports.length){const select=()=>show(reports.find(r=>r.fecha===location.hash.slice(1))||reports[0]);select();window.addEventListener('hashchange',select)}else{historyNav.append(el('small','Sin informes publicados'));report.append(el('small','Seguimiento normativo y administrativo'),el('h2','Informe diario BOE | Melilla'),el('p','La página está preparada para recibir los informes diarios. El histórico aparecerá al incorporar la primera revisión.'),el('p','La publicación automática todavía no está confirmada.'),link('Consultar el sumario oficial del BOE','https://www.boe.es/'),footer())}
</script></body></html>
